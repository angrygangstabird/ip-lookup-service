server.port=${PORT:8080}
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200
server.tomcat.connection-timeout=10000

ipstack.api.key=${IPSTACK_API_KEY}
ipstack.api.base-url=http://api.ipstack.com

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=300s
spring.cache.cache-names=ipLookup

spring.datasource.url=jdbc:h2:file:./data/journal;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=JournalPool

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

resilience4j.circuitbreaker.instances.ipstack.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ipstack.sliding-window-size=20
resilience4j.circuitbreaker.instances.ipstack.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ipstack.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ipstack.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.ipstack.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.ipstack.record-exceptions=java.lang.RuntimeException,java.io.IOException

resilience4j.retry.instances.ipstack.max-attempts=2
resilience4j.retry.instances.ipstack.wait-duration=500ms
resilience4j.retry.instances.ipstack.retry-exceptions=java.io.IOException

management.endpoints.web.exposure.include=health,info,metrics,caches,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
